[package]
name = "novel-studio-desktop"
version = "0.1.0"
description = "写作工作台 — AGT novel-init 项目的专属客户端（不依赖 DSH Web 服务）"
authors = ["sandyhery"]
edition = "2021"

[lib]
name = "novel_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
